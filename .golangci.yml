version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
        app:
          files:
            - "**/internal/app/**"
          allow:
            - $gostd
            - github.com/zezao/ticket-checkout-system/internal/domain
            - github.com/zezao/ticket-checkout-system/internal/domain/reservation
            - github.com/zezao/ticket-checkout-system/internal/domain/payment
            - github.com/zezao/ticket-checkout-system/internal/domain/order
        adapters:
          files:
            - "**/internal/adapters/**"
          allow:
            - $gostd
            - github.com/zezao/ticket-checkout-system/internal/domain
            - github.com/zezao/ticket-checkout-system/internal/domain/reservation
            - github.com/zezao/ticket-checkout-system/internal/domain/payment
            - github.com/zezao/ticket-checkout-system/internal/domain/order
            - github.com/zezao/ticket-checkout-system/internal/app
            - github.com/jackc/pgx
            - github.com/google/uuid
            - github.com/redis/go-redis
            - github.com/exaring/otelpgx
            - golang.org/x/sync
            - github.com/zezao/ticket-checkout-system/internal/observability
        worker:
          files:
            - "**/internal/worker/**"
          allow:
            - $gostd
            - github.com/zezao/ticket-checkout-system/internal/domain
            - github.com/zezao/ticket-checkout-system/internal/domain/reservation
            - github.com/zezao/ticket-checkout-system/internal/domain/payment
            - github.com/zezao/ticket-checkout-system/internal/domain/order
            - github.com/zezao/ticket-checkout-system/internal/app
            - github.com/zezao/ticket-checkout-system/internal/observability
        cmd:
          files:
            - "**/cmd/**"
          allow:
            - $gostd
            - github.com/zezao/ticket-checkout-system
            - github.com/google/uuid

formatters:
  enable:
    - gofmt
    - goimports
