services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable"
      - "up"

  seed:
    image: postgres:17-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: tickets
    volumes:
      - ./migrations/seed:/seed:ro
    command:
      - "psql"
      - "-h"
      - "postgres"
      - "-U"
      - "tickets"
      - "-d"
      - "tickets"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/seed/0001_seed.up.sql"

  api:
    build: .
    image: ticket-checkout:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    command: ["/app/api"]

  worker:
    build: .
    image: ticket-checkout:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
    command: ["/app/worker"]

volumes:
  postgres-data:
