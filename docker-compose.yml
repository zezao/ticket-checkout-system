services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable"
      - "up"

  seed:
    image: postgres:17-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: tickets
    volumes:
      - ./migrations/seed:/seed:ro
    command:
      - "psql"
      - "-h"
      - "postgres"
      - "-U"
      - "tickets"
      - "-d"
      - "tickets"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/seed/0001_seed.up.sql"

  api:
    build: .
    image: ticket-checkout:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HTTP_ADDR: ":8080"
      HOLD_TTL: ${HOLD_TTL:-10m}
      HOLD_RATE_LIMIT: ${HOLD_RATE_LIMIT:-60}
      PAYMENT_DEADLINE: ${PAYMENT_DEADLINE:-15m}
    ports:
      - "8080:8080"
    command: ["/app/api"]

  worker:
    build: .
    image: ticket-checkout:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PAYMENT_LEASE: ${PAYMENT_LEASE:-30s}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-10s}
      SWEEP_INTERVAL: ${SWEEP_INTERVAL:-5s}
      MOCK_BEHAVIOR: ${MOCK_BEHAVIOR:-success}
      METRICS_ADDR: ${METRICS_ADDR:-:9090}
    ports:
      - "9090:9090"
    command: ["/app/worker"]

  k6:
    image: grafana/k6:2.4.0
    profiles: ["bench"]
    depends_on:
      api:
        condition: service_started
    environment:
      BASE_URL: http://api:8080
      EVENT_ID: ${BENCH_EVENT_ID:-0199b000-0000-7000-8000-000000000001}
    volumes:
      - ./bench:/scripts:ro
    command: ["run", "/scripts/hold.js"]

volumes:
  postgres-data:
